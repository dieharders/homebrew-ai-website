<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Repeating doodle tile: brew bubbles, a foam puff, sparkles and squiggles.
       Used as a CSS mask (only its alpha matters), so each section can tint it
       and multiply it over its own ground. Motifs keep 14px clear of the edges
       so the tile repeats without seams. -->
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- bubbles -->
    <circle cx="36" cy="44" r="10"/>
    <circle cx="57" cy="27" r="5"/>
    <circle cx="59" cy="53" r="3.5"/>
    <!-- foam puff, the mascot's head of foam -->
    <path d="M128 60 a10 10 0 0 1 3 -19 a13 13 0 0 1 24 -7 a11 11 0 0 1 19 10 a8.5 8.5 0 0 1 -1 16 z"/>
    <!-- squiggle -->
    <path d="M22 152 q8 -12 16 0 t16 0 t16 0 t16 0"/>
    <!-- plus -->
    <path d="M128 130 v20 M118 140 h20"/>
    <!-- bubble pair -->
    <circle cx="178" cy="202" r="8"/>
    <circle cx="197" cy="186" r="4"/>
    <!-- swoosh -->
    <path d="M84 216 q14 -22 36 -14"/>
    <!-- small ring -->
    <circle cx="74" cy="100" r="4"/>
  </g>
  <g fill="#000">
    <!-- sparkles -->
    <path d="M205 102 Q207.5 117.5 223 120 Q207.5 122.5 205 138 Q202.5 122.5 187 120 Q202.5 117.5 205 102 Z"/>
    <path d="M44 198 Q45.5 207.5 55 209 Q45.5 210.5 44 220 Q42.5 210.5 33 209 Q42.5 207.5 44 198 Z"/>
    <!-- dots -->
    <circle cx="108" cy="90" r="3"/>
    <circle cx="224" cy="222" r="3.5"/>
    <circle cx="20" cy="102" r="2.5"/>
    <circle cx="214" cy="32" r="3"/>
  </g>
</svg>
