<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    The PaperBuff mark: an extruded, dog-eared page on an extruded sky-blue speech bubble (you
    talk to the document). A sibling of motionbuff.svg and filebuff.svg: same -14° tilt, same
    (-15, +15) extrusion and the same top-right light, with a base shape of its own.

    The coordinates were computed, not hand-placed: every shape is a convex core polygon
    rounded outward by a radius (the disc is a single point rounded by its radius). Sweeping
    such a shape along the extrusion is the rounded hull of the core and its shifted copy, so
    each wall silhouette below is exact. The bubble is the disc plus a tail, each swept on its
    own. Shapes are drawn in the tilted frame and rotated as a group. Ids are prefixed `pb`
    because an inlined copy shares the host document's id space.

    Scale 0.975 fits the tilted, extruded bubble to a 246-unit span, a few units inside the
    256 box so the edges don't clip when antialiased. The translate re-centres that span.
  -->
  <defs>
    <!-- Bubble face, in user space so the disc and its tail share one continuous fill:
         deep blue low-left, sky blue, pale cyan where the light lands. -->
    <linearGradient id="pbBg" gradientUnits="userSpaceOnUse"
                    x1="-73.2" y1="112.1" x2="73.2" y2="-112.1">
      <stop offset="0" stop-color="#1d4ed8" />
      <stop offset="0.5" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#a5f3fc" />
    </linearGradient>

    <radialGradient id="pbSheen" gradientUnits="userSpaceOnUse" cx="61.4" cy="-85" r="200.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Bubble wall. The axis runs between the points where the wall starts and ends (the
         extremes perpendicular to the extrusion), so one gradient shades the whole visible rim:
         lightest at its upper-left end, darkest where it turns away at the lower-right. -->
    <linearGradient id="pbTileWall" gradientUnits="userSpaceOnUse"
                    x1="-69.9" y1="-95.7" x2="51.7" y2="106.6">
      <stop offset="0" stop-color="#0369a1" />
      <stop offset="0.5" stop-color="#075985" />
      <stop offset="1" stop-color="#0c2a4a" />
    </linearGradient>

    <!-- page face -->
    <linearGradient id="pbFace" gradientUnits="userSpaceOnUse"
                    x1="64" y1="-67.5" x2="-30" y2="54.5">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#f5faff" />
      <stop offset="1" stop-color="#e2f0fc" />
    </linearGradient>

    <!-- the folded flap shows the paper's back: a step darker, deepest in its inner corner -->
    <linearGradient id="pbFlap" gradientUnits="userSpaceOnUse"
                    x1="49.5" y1="-53" x2="35" y2="-38.5">
      <stop offset="0" stop-color="#e3f0fb" />
      <stop offset="1" stop-color="#b4d4ef" />
    </linearGradient>

    <!-- page walls: light blue-grey on the left, slate blue below -->
    <linearGradient id="pbWall" gradientUnits="userSpaceOnUse"
                    x1="-34.2" y1="-60.6" x2="50.1" y2="58.5">
      <stop offset="0" stop-color="#dfeaf6" />
      <stop offset="0.45" stop-color="#93b3d3" />
      <stop offset="1" stop-color="#46698f" />
    </linearGradient>

    <clipPath id="pbPageClip">
      <path d="M-20 -67.5 L30.9 -67.5 A10 10 0 0 1 37.9 -64.6 L37.9 -64.6 L61.1 -41.4 A10 10 0 0 1 64 -34.4 L64 -34.4 L64 44.5 A10 10 0 0 1 54 54.5 L54 54.5 L-20 54.5 A10 10 0 0 1 -30 44.5 L-30 44.5 L-30 -57.5 A10 10 0 0 1 -20 -67.5Z" />
    </clipPath>

    <!-- cast down-left, navy so it reads on the saturated blue -->
    <filter id="pbCast" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="-11" dy="13" stdDeviation="10" flood-color="#0b1e3a" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="translate(134.7 120.7) scale(0.9748)">
    <g transform="rotate(-14)">
      <!-- swept silhouettes (the rim), then the face and its sheen -->
      <path d="M-79 -90.2 L-60.8 -101.1 A118 118 0 0 1 60.8 101.1 L60.8 101.1 L42.6 112.1 A118 118 0 0 1 -79 -90.2Z" fill="url(#pbTileWall)" />
      <path d="M26.6 100 L59.9 72.1 A5 5 0 0 1 60.5 71.7 L60.5 71.7 L78.7 60.7 A5 5 0 0 1 86.2 64.4 L86.2 64.4 L93 119 A5 5 0 0 1 90.6 123.9 L90.6 123.9 L72.4 134.8 A5 5 0 0 1 67.1 134.7 L67.1 134.7 L27 108 A5 5 0 0 1 26.6 100Z" fill="url(#pbTileWall)" />
      <circle r="118" fill="url(#pbBg)" />
      <path d="M86.2 64.4 L93 119 A5 5 0 0 1 85.3 123.8 L85.3 123.8 L45.2 97.1 A5 5 0 0 1 44.8 89.1 L44.8 89.1 L78.1 61.2 A5 5 0 0 1 86.2 64.4Z" fill="url(#pbBg)" />
      <circle r="118" fill="url(#pbSheen)" />
      <path d="M86.2 64.4 L93 119 A5 5 0 0 1 85.3 123.8 L85.3 123.8 L45.2 97.1 A5 5 0 0 1 44.8 89.1 L44.8 89.1 L78.1 61.2 A5 5 0 0 1 86.2 64.4Z" fill="url(#pbSheen)" />
    </g>

    <g filter="url(#pbCast)">
      <g transform="rotate(-14)">
        <path d="M-43.3 -55.1 L-25.2 -66.1 A10 10 0 0 1 -20 -67.5 L-20 -67.5 L30.9 -67.5 A10 10 0 0 1 37.9 -64.6 L37.9 -64.6 L61.1 -41.4 A10 10 0 0 1 64 -34.4 L64 -34.4 L64 44.5 A10 10 0 0 1 59.2 53.1 L59.2 53.1 L41 64 A10 10 0 0 1 35.8 65.4 L35.8 65.4 L-38.2 65.4 A10 10 0 0 1 -48.2 55.4 L-48.2 55.4 L-48.2 -46.6 A10 10 0 0 1 -43.3 -55.1Z" fill="url(#pbWall)" />
        <path d="M-20 -67.5 L30.9 -67.5 A10 10 0 0 1 37.9 -64.6 L37.9 -64.6 L61.1 -41.4 A10 10 0 0 1 64 -34.4 L64 -34.4 L64 44.5 A10 10 0 0 1 54 54.5 L54 54.5 L-20 54.5 A10 10 0 0 1 -30 44.5 L-30 44.5 L-30 -57.5 A10 10 0 0 1 -20 -67.5Z" fill="url(#pbFace)" />
        <path d="M43.5 -99 L95.5 -47 A5 5 0 0 1 91.9 -38.5 L91.9 -38.5 L40 -38.5 A5 5 0 0 1 35 -43.5 L35 -43.5 L35 -95.4 A5 5 0 0 1 43.5 -99Z" fill="url(#pbFlap)" clip-path="url(#pbPageClip)" />
      </g>
    </g>
  </g>
</svg>
